[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "fastembed==0.8.1",
    "psycopg[binary]>=3.2",
    "pgvector",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not model and not live and not db and not live_llm'"
markers = [
    "live: requires live SEC access",
    "model: loads the local real embedding model and may download it",
    "db: requires the local compose PostgreSQL database",
    "live_llm: requires an explicitly approved live LLM call",
]

[tool.setuptools.packages.find]
include = ["app*"]
