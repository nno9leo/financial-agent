services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_research}
      POSTGRES_USER: ${POSTGRES_USER:-financial_research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial_research}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
